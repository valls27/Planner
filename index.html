<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Planos — Planificador de vivienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4EE;
  --bg-grid:#EDEAE0;
  --surface:#FFFFFF;
  --surface-2:#F0EEE6;
  --ink:#1E2A2E;
  --ink-soft:#5B6B6E;
  --line:#DAD5C7;
  --blue:#1463D6;
  --blue-soft:#CFE2FB;
  --brick:#E43A1E;
  --brick-soft:#FBD9CE;
  --green:#0FA958;
  --green-soft:#CDF2DC;
  --amber:#E8A400;
  --amber-soft:#FCE7B4;
  --purple:#8B2FE0;
  --purple-soft:#E7D4FA;
  --pink:#E62E8B;
  --pink-soft:#FBD4E8;
  --cyan:#0AA9C4;
  --cyan-soft:#CBF0F6;
  --radius:10px;
  --shadow:0 1px 2px rgba(30,42,46,.06), 0 6px 20px -8px rgba(30,42,46,.12);
}
html.dark{
  --bg:#12181A;
  --bg-grid:#182022;
  --surface:#1A2224;
  --surface-2:#202A2C;
  --ink:#EDEDE6;
  --ink-soft:#93A3A5;
  --line:#2B3638;
  --blue:#4E9CFF;
  --blue-soft:#123456;
  --brick:#FF5A3C;
  --brick-soft:#4A2013;
  --green:#2BDB86;
  --green-soft:#0F3B24;
  --amber:#FFC531;
  --amber-soft:#4A3608;
  --purple:#B073FF;
  --purple-soft:#33184F;
  --pink:#FF5CAA;
  --pink-soft:#4A1830;
  --cyan:#33D2EE;
  --cyan-soft:#0E3C42;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3,.display{font-family:'Fraunces',serif;letter-spacing:-.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px}
label{font-size:12px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:4px}
.field{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}

/* App shell */
#app{display:flex;min-height:100vh}
.sidebar{
  width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);
  padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:24px;padding:0 6px}
.brand-mark{width:30px;height:30px;border-radius:7px;background:
  repeating-linear-gradient(0deg, var(--blue) 0 1px, transparent 1px 8px),
  repeating-linear-gradient(90deg, var(--blue) 0 1px, transparent 1px 8px), var(--blue-soft);
  border:1.5px solid var(--blue);flex-shrink:0}
.brand-name{font-family:'Fraunces',serif;font-weight:600;font-size:18px}
.navlink{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink-soft);text-decoration:none;font-size:14px;font-weight:500;border:none;background:transparent;text-align:left;width:100%}
.navlink:hover{background:var(--surface-2);color:var(--ink)}
.navlink.active{background:var(--blue-soft);color:var(--blue);font-weight:600}
.navlink .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.6}
.nav-sep{height:1px;background:var(--line);margin:12px 6px}
.theme-toggle{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;font-size:13px;color:var(--ink-soft)}
.switch{width:38px;height:22px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line);position:relative;padding:0}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--blue);transition:transform .15s}
html.dark .switch::after{transform:translateX(16px)}

main{flex:1;min-width:0;padding:28px 32px 100px;max-width:1200px}
@media (max-width:900px){
  .sidebar{display:none}
  main{padding:18px 16px 90px}
}

.bottomnav{
  display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);
  border-top:1px solid var(--line);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
@media (max-width:900px){.bottomnav{display:flex;justify-content:space-around}}
.bottomnav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--ink-soft);padding:4px 6px;font-weight:600}
.bottomnav button.active{color:var(--blue)}
.bottomnav svg{width:20px;height:20px}

.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.pagehead h1{font-size:26px;margin:0 0 4px}
.pagehead p{margin:0;color:var(--ink-soft);font-size:14px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--blue);font-weight:700;margin-bottom:4px}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:8px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.brick{background:var(--brick);border-color:var(--brick);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--brick);border-color:var(--brick-soft)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card + .card{margin-top:14px}

.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.projcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden;text-decoration:none;color:inherit;display:block;box-shadow:var(--shadow);transition:transform .1s}
.projcard:hover{transform:translateY(-2px)}
.projcard-top{height:64px;background:repeating-linear-gradient(135deg, var(--bg-grid) 0 10px, var(--surface) 10px 20px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;justify-content:space-between}
.status-chip{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:20px}
.projcard-body{padding:14px 16px 16px}
.projcard-body h3{margin:0 0 2px;font-size:17px}
.projcard-body .loc{color:var(--ink-soft);font-size:13px;margin-bottom:10px}
.projcard-stats{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.projcard-stats b{display:block;font-family:'IBM Plex Mono',monospace;font-size:14px}
.score-badge{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;border:2px solid var(--blue);color:var(--blue);flex-shrink:0}

.empty{border:1.5px dashed var(--line);border-radius:12px;padding:48px 20px;text-align:center;color:var(--ink-soft)}
.empty h3{color:var(--ink);margin-bottom:6px}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:none;padding:10px 14px;font-size:13px;font-weight:600;color:var(--ink-soft);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.active{color:var(--blue);border-color:var(--blue)}
.floor-tabs-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.floor-tabs-row .tabs button{border-radius:20px;border:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:0;padding:7px 14px}
.floor-tabs-row .tabs button.active{background:var(--blue);border-color:var(--blue);color:#fff}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);padding:6px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-family:'IBM Plex Mono',monospace}

.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
.pill.pro{background:var(--green-soft);color:var(--green)}
.pill.con{background:var(--brick-soft);color:var(--brick)}

.modal-bg{position:fixed;inset:0;background:rgba(20,25,25,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100}
@media (min-width:700px){.modal-bg{align-items:center}}
.modal{background:var(--surface);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow)}
@media (min-width:700px){.modal{border-radius:14px;max-height:82vh}}
.modal h2{margin:0 0 16px;font-size:19px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;position:sticky;bottom:-20px;background:var(--surface);padding-top:10px}

.rowline{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rowline:last-child{border-bottom:none}

.progress{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.progress > div{height:100%;background:var(--blue)}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat .v{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600}
.stat .l{font-size:12px;color:var(--ink-soft);margin-top:2px}

.icon-btn{background:var(--surface-2);border:1px solid var(--line);color:var(--ink);padding:5px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px}
.icon-btn svg{width:15px;height:15px;display:block}
.icon-btn:hover{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.icon-btn.danger-hover:hover{background:var(--brick-soft);border-color:var(--brick);color:var(--brick)}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.icon-btn:disabled:hover{background:var(--surface-2);border-color:var(--line);color:var(--ink)}

/* floor plan */
.plan-wrap{display:flex;gap:16px;flex-wrap:wrap}
.plan-wrap>div:first-child{flex:1;min-width:300px}
.plan-toolbar{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.plan-canvas-holder{width:100%;min-width:280px;height:480px;min-height:320px;max-height:80vh;resize:vertical;background:
  linear-gradient(var(--bg-grid) 1px, transparent 1px), linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
  background-size:20px 20px; background-color: var(--surface); border:1px solid var(--line);border-radius:10px;overflow:auto;touch-action:none}
.plan-side{width:230px;flex-shrink:0}
.furn-item{display:flex;justify-content:space-between;align-items:center;padding:7px 8px;border:1px solid var(--line);border-radius:7px;margin-bottom:6px;font-size:12.5px;background:var(--surface)}
.furn-item button{font-size:11px}
.swatch{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.15);display:inline-block;vertical-align:-3px;margin-right:4px}

.chk{display:flex;align-items:center;gap:8px}
.chk input{width:auto}

.help{font-size:12px;color:var(--ink-soft);margin-top:-6px;margin-bottom:12px}

textarea{resize:vertical;min-height:70px}

.thumb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.thumb{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .rm{position:absolute;top:3px;right:3px;background:rgba(20,20,20,.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px}
.doc-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.doc-row:last-child{border-bottom:none}

.imp-dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);margin-right:2px}
.imp-dots span.on{background:var(--blue)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:30px;font-size:13px;z-index:200;box-shadow:var(--shadow)}
@media (max-width:900px){.toast{bottom:76px}}

.compare-select{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.compare-chip{border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:12.5px;background:var(--surface);cursor:pointer}
.compare-chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}

.timeline{position:relative;padding-left:22px}
.timeline::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;margin-bottom:16px}
.tl-item::before{content:'';position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--dot-bg, var(--surface));border:2px solid var(--dot-border, var(--blue))}

.item-actions{display:inline-flex;gap:4px;align-items:center;flex-shrink:0}
.prio-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;flex-shrink:0}
.layer-btns{display:flex;gap:2px;align-items:center}
.layer-btns button{font-size:11px;line-height:1;padding:4px 5px}

/* ---- Exportación / impresión a PDF ---- */
.print-report{display:none}
@media print{
  body *{visibility:hidden}
  .print-report, .print-report *{visibility:visible}
  .print-report{display:block !important;position:absolute;top:0;left:0;width:100%;padding:10px 24px}
  #app,.bottomnav,#modal-root,#toast-root{display:none !important}
}
.pr-header{border-bottom:2px solid #1E2A2E;padding-bottom:10px;margin-bottom:18px}
.pr-header h1{margin:0 0 4px;font-size:24px}
.pr-header p{margin:0;color:#5B6B6E;font-size:13px}
.pr-section{margin-bottom:20px;page-break-inside:avoid}
.pr-section h2{font-size:16px;margin:0 0 8px;border-bottom:1px solid #DAD5C7;padding-bottom:4px}
.pr-section h3{font-size:13px;margin:0 0 6px}
.pr-table{width:100%;border-collapse:collapse;font-size:12.5px}
.pr-table td{padding:4px 8px;border-bottom:1px solid #eee}
.pr-table td:last-child{text-align:right;font-family:monospace}
.pr-two-col{display:flex;gap:24px}
.pr-two-col > div{flex:1}
.pr-two-col ul{margin:0;padding-left:18px;font-size:12.5px}
.pr-plan-img{max-width:100%;border:1px solid #DAD5C7;border-radius:6px}
.pr-photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pr-photo-grid img{width:100%;height:130px;object-fit:cover;border-radius:6px;border:1px solid #DAD5C7}
.pr-section ul{font-size:12.5px;margin:0;padding-left:18px}
.pr-footer{margin-top:26px;font-size:10.5px;color:#999;text-align:center}
</style>
</head>
<body>
<div id="app">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="main"></main>
</div>
<nav class="bottomnav" id="bottomnav"></nav>
<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="print-root" class="print-report"></div>

<script>
/* =========================================================
   CASA PLANNER — datos guardados en la nube (Cloudflare Pages
   Functions + KV), con copia local en localStorage como caché
   offline y red de seguridad.
   ========================================================= */
const DB_KEY = 'casaPlannerDB_v1';
const TOKEN_KEY = 'casaPlannerToken';
const uid = () => Math.random().toString(36).slice(2,10);
const nowISO = () => new Date().toISOString();

function defaultDB(){
  return {
    theme: 'light',
    activeProjectId: null,
    materials: [
      {id:uid(), category:'Suelo', name:'Porcelánico gris', price:24, unit:'m2', provider:'', link:'', color:'#B9B9B0', notes:''},
      {id:uid(), category:'Pared', name:'Pintura plástica blanca', price:6, unit:'m2', provider:'', link:'', color:'#F2F1EA', notes:''},
      {id:uid(), category:'Ventana', name:'PVC doble cristal', price:280, unit:'ud', provider:'', link:'', color:'#DCE8ED', notes:''}
    ],
    projects: []
  };
}
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return defaultDB();
    const d = JSON.parse(raw);
    return Object.assign(defaultDB(), d);
  }catch(e){ return defaultDB(); }
}
let DB = defaultDB(); // se rellena de verdad tras iniciar sesión, en initApp()

let cloudSyncTimer = null;
function save(){
  localStorage.setItem(DB_KEY, JSON.stringify(DB));
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(syncToCloud, 1200);
}
async function syncToCloud(){
  try{
    await apiFetch('/api/data', {method:'PUT', body: JSON.stringify({data: DB})});
  }catch(e){
    console.error('Error sincronizando con la nube', e);
  }
}

/* ---------------- AUTENTICACIÓN ---------------- */
function getToken(){ return localStorage.getItem(TOKEN_KEY); }
function setToken(t){ localStorage.setItem(TOKEN_KEY, t); }
function clearToken(){ localStorage.removeItem(TOKEN_KEY); }
function logout(){ clearToken(); location.reload(); }

async function apiFetchNoAuth(path, opts){
  opts = opts || {};
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  const res = await fetch(path, Object.assign({}, opts, {headers}));
  const body = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(body.error || 'error');
  return body;
}
async function apiFetch(path, opts){
  opts = opts || {};
  const token = getToken();
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(token) headers['Authorization'] = 'Bearer '+token;
  const res = await fetch(path, Object.assign({}, opts, {headers}));
  if(res.status===401){
    clearToken();
    renderAuthScreen('login', 'Tu sesión ha caducado. Inicia sesión de nuevo.');
    throw new Error('401');
  }
  const body = await res.json().catch(()=>null);
  if(!res.ok) throw new Error((body && body.error) || 'error');
  return body;
}

function renderAuthScreen(mode, message){
  mode = mode || 'login';
  document.getElementById('sidebar').innerHTML = '';
  document.getElementById('bottomnav').innerHTML = '';
  document.getElementById('main').innerHTML = `
    <div style="min-height:80vh;width:100%;display:flex;align-items:center;justify-content:center;padding:20px">
      <div class="card" style="max-width:380px;width:100%">
        <div class="brand" style="margin-bottom:18px">
          <div class="brand-mark"></div><div class="brand-name">Planos</div>
        </div>
        <h2 style="margin:0 0 4px">${mode==='login'?'Iniciar sesión':'Crear cuenta'}</h2>
        <p style="color:var(--ink-soft);font-size:13px;margin:0 0 18px">${mode==='login'?'Accede a tus proyectos desde cualquier dispositivo.':'Crea una cuenta para guardar tus proyectos en la nube.'}</p>
        ${message?`<p style="color:var(--brick);font-size:13px;margin:0 0 14px">${escapeHtml(message)}</p>`:''}
        <div class="field"><label>Usuario</label><input id="auth-user" autocomplete="username"></div>
        <div class="field"><label>Contraseña</label><input id="auth-pass" type="password" autocomplete="${mode==='login'?'current-password':'new-password'}"></div>
        <button class="btn primary" style="width:100%;justify-content:center;margin-bottom:10px" id="auth-submit">${mode==='login'?'Entrar':'Crear cuenta'}</button>
        <button class="btn ghost" style="width:100%;justify-content:center" id="auth-switch">${mode==='login'?'¿No tienes cuenta? Regístrate':'¿Ya tienes cuenta? Inicia sesión'}</button>
      </div>
    </div>
  `;
  document.getElementById('auth-submit').onclick = mode==='login' ? handleLogin : handleRegister;
  document.getElementById('auth-switch').onclick = () => renderAuthScreen(mode==='login'?'register':'login');
  const passInput = document.getElementById('auth-pass');
  passInput.addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('auth-submit').click(); });
}

async function handleLogin(){
  const user = document.getElementById('auth-user').value.trim().toLowerCase();
  const pass = document.getElementById('auth-pass').value;
  if(!user || !pass){ renderAuthScreen('login','Introduce usuario y contraseña.'); return; }
  try{
    const data = await apiFetchNoAuth('/api/login', {method:'POST', body: JSON.stringify({username:user, password:pass})});
    setToken(data.token);
    await initApp();
  }catch(e){
    renderAuthScreen('login', 'Usuario o contraseña incorrectos.');
  }
}
async function handleRegister(){
  const user = document.getElementById('auth-user').value.trim().toLowerCase();
  const pass = document.getElementById('auth-pass').value;
  if(!user || !pass){ renderAuthScreen('register','Introduce usuario y contraseña.'); return; }
  if(!/^[a-z0-9_.-]{3,32}$/.test(user)){ renderAuthScreen('register','El usuario debe tener 3-32 caracteres (letras, números, . _ -).'); return; }
  if(pass.length<6){ renderAuthScreen('register','La contraseña debe tener al menos 6 caracteres.'); return; }
  try{
    const data = await apiFetchNoAuth('/api/register', {method:'POST', body: JSON.stringify({username:user, password:pass})});
    setToken(data.token);
    await initApp();
  }catch(e){
    renderAuthScreen('register', e.message==='exists' ? 'Ese usuario ya existe.' : 'No se pudo crear la cuenta.');
  }
}

async function initApp(){
  let remote = null;
  try{
    const resp = await apiFetch('/api/data', {method:'GET'});
    remote = resp && resp.data ? resp.data : null;
  }catch(e){
    console.warn('No se pudo cargar de la nube, usando copia local si existe.', e);
  }
  DB = remote ? Object.assign(defaultDB(), remote) : loadDB();
  DB.projects.forEach(migrateProject);
  localStorage.setItem(DB_KEY, JSON.stringify(DB));
  applyTheme();
  route();
}

const BUDGET_FIELDS = [
  ['impuestos','Impuestos'],['notaria','Notaría'],['registro','Registro'],['gestoria','Gestoría'],
  ['tasacion','Tasación'],['reforma','Reforma (obra)'],['electricidad','Electricidad'],
  ['fontaneria','Fontanería'],['climatizacion','Climatización'],['cocina','Cocina'],['banos','Baños'],
  ['suelos','Suelos'],['puertas','Puertas'],['ventanas','Ventanas'],['pintura','Pintura'],
  ['iluminacion','Iluminación'],['mobiliario','Mobiliario'],['electrodomesticos','Electrodomésticos'],
  ['decoracion','Decoración'],['otros','Otros gastos']
];

function newProject(name){
  const budget = {}; BUDGET_FIELDS.forEach(([k])=>budget[k]=0);
  return {
    id: uid(), name: name||'Nuevo proyecto', type:'Piso', location:'', status:'Idea',
    purchasePrice:0, maxBudget:0, description:'', notes:'',
    entradaPct:20, entradaMode:'preset', taxAuto:true, taxRate:8,
    budget, prosCons:[], tasks:[], timeline:[], rooms:[], walls:[], columns:[],
    floors:[{id:uid(), name:'Planta baja'}],
    photos:[], documents:[], links:[],
    createdAt: nowISO(), updatedAt: nowISO()
  };
}
const FLOOR_PRESETS = ['Sótano','Planta baja','Entreplanta','Planta 1ª','Planta 2ª','Planta 3ª','Ático','Buhardilla','Garaje','Terraza'];
function migrateProject(p){
  if((!p.purchasePrice || p.purchasePrice===0) && p.budget && p.budget.precioInmueble){
    p.purchasePrice = Number(p.budget.precioInmueble)||0;
  }
  if(p.entradaPct===undefined) p.entradaPct = 20;
  if(p.entradaMode===undefined) p.entradaMode = 'preset';
  if(p.taxAuto===undefined) p.taxAuto = true;
  if(p.taxRate===undefined) p.taxRate = 8;
  if(!p.floors || !p.floors.length) p.floors = [{id:uid(), name:'Planta baja'}];
  const defaultFloorId = p.floors[0].id;
  (p.rooms||[]).forEach(r=>{
    if(!r.points){
      const scale = 40;
      const rw = (Number(r.length)||4)*scale, rh = (Number(r.width)||3)*scale;
      const x = Number(r.x)||20, y = Number(r.y)||20;
      r.points = [{x,y},{x:x+rw,y},{x:x+rw,y:y+rh},{x,y:y+rh}];
    }
    if(r.height===undefined) r.height = 2.5;
    if(!r.floor) r.floor = defaultFloorId;
  });
  if(!p.walls) p.walls = [];
  if(!p.columns) p.columns = [];
  if(!p.photos) p.photos = [];
  if(!p.documents) p.documents = [];
  if(!p.links) p.links = [];
  p.walls.forEach(w=>{ if(!w.floor) w.floor = defaultFloorId; if(!w.openings) w.openings = []; });
  p.columns.forEach(c=>{ if(!c.floor) c.floor = defaultFloorId; });
  return p;
}
function polygonAreaPx(points){
  let a=0;
  for(let i=0;i<points.length;i++){
    const p1=points[i], p2=points[(i+1)%points.length];
    a += p1.x*p2.y - p2.x*p1.y;
  }
  return Math.abs(a)/2;
}
function roomAreaM2(r){ return polygonAreaPx(r.points)/(planState.scale*planState.scale); }
function pointInPolygon(pt, points){
  let inside=false;
  for(let i=0,j=points.length-1;i<points.length;j=i++){
    const xi=points[i].x, yi=points[i].y, xj=points[j].x, yj=points[j].y;
    const intersect = ((yi>pt.y)!==(yj>pt.y)) && (pt.x < (xj-xi)*(pt.y-yi)/((yj-yi)||1e-6)+xi);
    if(intersect) inside=!inside;
  }
  return inside;
}
function taxAutoOf(p){ return p.taxAuto !== false; }
function taxRateOf(p){ return p.taxRate ?? 8; }
function entradaPctOf(p){ return p.entradaPct ?? 20; }
function recomputeTaxIfAuto(p){
  if(taxAutoOf(p)){
    p.budget.impuestos = Math.round((Number(p.purchasePrice)||0) * (Number(taxRateOf(p))||0)/100);
  }
}

function budgetTotal(p){
  return (Number(p.purchasePrice)||0) + BUDGET_FIELDS.reduce((s,[k])=>s + (Number(p.budget[k])||0), 0);
}
function furnitureTotal(p){
  let t=0; (p.rooms||[]).forEach(r=>(r.furniture||[]).forEach(f=>t+=Number(f.price)||0));
  return t;
}
function totalCost(p){ return budgetTotal(p) + furnitureTotal(p); }
function totalArea(p){ return (p.rooms||[]).reduce((s,r)=>s+roomAreaM2(r),0); }
function costPerM2(p){ const a=totalArea(p); return a>0 ? totalCost(p)/a : 0; }

function projectScore(p){
  const pc = p.prosCons||[];
  if(pc.length===0) return null;
  let pros=0, cons=0;
  pc.forEach(x=>{ if(x.type==='pro') pros+=Number(x.importance)||1; else cons+=Number(x.importance)||1; });
  const total = pros+cons;
  if(total===0) return 50;
  return Math.round((pros/total)*100);
}

function fmtMoney(n){
  n = Number(n)||0;
  return n.toLocaleString('es-ES',{maximumFractionDigits:0}) + ' €';
}
function fmtM2(n){ return (Number(n)||0).toLocaleString('es-ES',{maximumFractionDigits:1}) + ' m²'; }

function viewDashboard(){
  const projects = DB.projects;
  const n = projects.length;
  const totalBudget = projects.reduce((s,p)=>s+totalCost(p),0);
  const avgCost = n? totalBudget/n : 0;
  const cheapest = n? projects.reduce((a,b)=> totalCost(a)<totalCost(b)?a:b) : null;
  const bestScored = n? projects.filter(p=>projectScore(p)!==null).sort((a,b)=>projectScore(b)-projectScore(a))[0] : null;
  const avgM2 = (()=>{ const withArea = projects.filter(p=>totalArea(p)>0); if(!withArea.length) return 0;
    return withArea.reduce((s,p)=>s+costPerM2(p),0)/withArea.length; })();

  return `
    <div class="pagehead">
      <div><div class="eyebrow">Panel general</div><h1>Mis proyectos</h1><p>Todo se guarda en este dispositivo, sin conexión.</p></div>
      <button class="btn primary" onclick="showNewProjectModal()">${ICONS.plus}Nuevo proyecto</button>
    </div>

    ${n? `

      <div class="stat"><div class="v">${cheapest?cheapest.name:'—'}</div><div class="l">Proyecto más barato</div></div>
      <div class="stat"><div class="v">${bestScored?bestScored.name:'—'}</div><div class="l">Mejor valorado</div></div>
      <div class="stat"><div class="v">${fmtMoney(avgM2)}/m²</div><div class="l">Coste medio por m²</div></div>
    </div>` : ''}

    ${n===0 ? `
      <div class="empty">
        <h3>Todavía no hay proyectos</h3>
        <p>Crea tu primer proyecto de vivienda: casa, piso, reforma o solar.</p>
        <div style="margin-top:14px"><button class="btn primary" onclick="showNewProjectModal()">${ICONS.plus}Crear proyecto</button></div>
      </div>
    ` : `
    <div class="cardgrid">
      ${projects.map(p=>{
        const s = projectScore(p);
        const sc = STATUS_COLORS[p.status]||STATUS_COLORS['Idea'];
        return `
        <a class="projcard" href="#/project/${p.id}/resumen">
          <div class="projcard-top">
            <span class="status-chip" style="background:${sc.bg};color:${sc.fg}">${p.status}</span>
            ${s!==null?`<div class="score-badge">${s}</div>`:''}
          </div>
          <div class="projcard-body">
            <h3>${escapeHtml(p.name)}</h3>
            <div class="loc">${escapeHtml(p.location||p.type)}</div>
            <div class="projcard-stats">
              <div>Coste<b>${fmtMoney(totalCost(p))}</b></div>
              <div>Superficie<b>${fmtM2(totalArea(p))}</b></div>
            </div>
          </div>
        </a>`;
      }).join('')}
    </div>
    `}
  `;
}

function fmtLenPx(px){
  const m = Math.abs(px)/planState.scale;
  if(m < 1) return Math.round(m*100)+' cm';
  return (Math.round(m*100)/100).toLocaleString('es-ES',{maximumFractionDigits:2}) + ' m';
}
function distPx(a,b){ return Math.hypot(b.x-a.x, b.y-a.y); }
function wallLenM(w){ return distPx(w.a,w.b)/planState.scale; }
function snapPoint(pos, p, excludeWallId){
  // Ajusta el punto a esquinas de habitaciones o extremos de otros muros cercanos (de la misma planta), para encajar muros con precisión
  const R = 12;
  for(const r of roomsOnFloor(p)){ for(const pt of r.points){ if(distPx(pos,pt)<R) return {x:pt.x,y:pt.y}; } }
  for(const w of wallsOnFloor(p)){ if(w.id===excludeWallId) continue;
    if(distPx(pos,w.a)<R) return {x:w.a.x,y:w.a.y};
    if(distPx(pos,w.b)<R) return {x:w.b.x,y:w.b.y};
  }
  // Engancha también a cualquier punto sobre el borde de una habitación (no solo esquinas),
  // para poder trazar muros que dividan un espacio en dos.
  for(const r of roomsOnFloor(p)){
    const edge = findEdgeForPoint(r.points, pos, R);
    if(edge) return edge.point;
  }
  return pos;
}
/* Ajusta el ángulo de un punto respecto a un origen fijo a 0/45/90/135° (y sus opuestos)
   cuando está cerca de uno de esos ángulos; si no, deja el punto libre tal cual. Así
   se puede dibujar en ángulos "limpios" sin perder la posibilidad de trazar en diagonal. */
function snapAngleFrom(origin, pos, thresholdDeg){
  thresholdDeg = thresholdDeg==null ? 6 : thresholdDeg;
  const dx = pos.x-origin.x, dy = pos.y-origin.y;
  const dist = Math.hypot(dx,dy);
  if(dist < 2) return pos;
  const ang = Math.atan2(dy,dx);
  const step = Math.PI/4; // 45°
  const snapped = Math.round(ang/step)*step;
  let diff = Math.abs(ang-snapped);
  if(diff > Math.PI) diff = Math.PI*2-diff;
  if(diff <= thresholdDeg*Math.PI/180){
    return { x: origin.x + Math.cos(snapped)*dist, y: origin.y + Math.sin(snapped)*dist };
  }
  return pos;
}
/* Combina el snap a puntos (esquinas/muros cercanos) con el snap de ángulo: el snap a
   puntos manda siempre que aplique (para encajar esquinas con precisión); si no hay un
   punto cerca, se prueba el ángulo respecto al origen dado (p.ej. el otro extremo del muro). */
function smartSnap(pos, p, excludeWallId, angleOrigin){
  const pointSnapped = snapPoint(pos, p, excludeWallId);
  if(pointSnapped.x !== pos.x || pointSnapped.y !== pos.y) return pointSnapped;
  if(angleOrigin) return snapAngleFrom(angleOrigin, pos, 6);
  return pos;
}

/* Dibuja una etiqueta de longitud con halo blanco, legible sobre cualquier fondo */
function drawLenLabel(ctx, a, b, text, color){
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  ctx.save();
  ctx.font='600 11px IBM Plex Mono';
  ctx.lineWidth=3; ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.strokeText(text,mx+4,my-4);
  ctx.fillStyle=color||'#1E2A2E'; ctx.fillText(text,mx+4,my-4);
  ctx.restore();
}
/* Dibuja un muro como un rectángulo grueso perpendicular a la línea a→b */
function drawWallShape(ctx, a, b, thicknessPx, strokeColor, fillColor, dashed){
  const dx=b.x-a.x, dy=b.y-a.y; const len=Math.hypot(dx,dy)||1;
  const nx=-dy/len, ny=dx/len; const h=Math.max(2,thicknessPx)/2;
  ctx.save();
  if(dashed){ ctx.globalAlpha=0.55; ctx.setLineDash([6,4]); }
  ctx.beginPath();
  ctx.moveTo(a.x+nx*h, a.y+ny*h);
  ctx.lineTo(b.x+nx*h, b.y+ny*h);
  ctx.lineTo(b.x-nx*h, b.y-ny*h);
  ctx.lineTo(a.x-nx*h, a.y-ny*h);
  ctx.closePath();
  ctx.fillStyle = fillColor; ctx.fill();
  ctx.strokeStyle = strokeColor; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
}
function pointToSegDistPx(pt,a,b){
  const l2 = distPx(a,b)**2;
  if(l2===0) return distPx(pt,a);
  let t = ((pt.x-a.x)*(b.x-a.x)+(pt.y-a.y)*(b.y-a.y))/l2;
  t = Math.max(0,Math.min(1,t));
  return distPx(pt, {x:a.x+t*(b.x-a.x), y:a.y+t*(b.y-a.y)});
}
/* Como pointToSegDistPx pero devuelve también el punto proyectado y el parámetro t (0..1) */
function pointToSegProj(pt,a,b){
  const l2 = distPx(a,b)**2;
  if(l2===0) return {t:0, point:{x:a.x,y:a.y}, dist:distPx(pt,a)};
  let t = ((pt.x-a.x)*(b.x-a.x)+(pt.y-a.y)*(b.y-a.y))/l2;
  t = Math.max(0,Math.min(1,t));
  const point = {x:a.x+t*(b.x-a.x), y:a.y+t*(b.y-a.y)};
  return {t, point, dist:distPx(pt,point)};
}
/* Busca en qué arista de un polígono cae un punto (para insertarlo como vértice). Devuelve {edgeIndex, t, point} o null */
function findEdgeForPoint(polyPoints, pt, epsilon){
  let best=null;
  for(let i=0;i<polyPoints.length;i++){
    const a=polyPoints[i], b=polyPoints[(i+1)%polyPoints.length];
    const res = pointToSegProj(pt,a,b);
    if(res.dist<epsilon && (!best || res.dist<best.dist)) best = {edgeIndex:i, t:res.t, point:res.point, dist:res.dist};
  }
  return best;
}
/* Dibuja un símbolo esquemático de mobiliario en planta (estilo plano de arquitecto) */
function drawFurnitureSymbol(ctx, f){

/* --- División de una habitación en dos usando una cadena de muros --- */
function keyOfPt(pt){ return Math.round(pt.x/1.5)+','+Math.round(pt.y/1.5); }
function insertPointOnEdge(polyPoints, edgeIndex, point){
  const arr = polyPoints.map(pt=>({...pt}));
  arr.splice(edgeIndex+1, 0, {x:point.x, y:point.y});
  return arr;
}
function splitPolygonByChain(polyPoints, chainPoints, epsilon){
  epsilon = epsilon||20;
  const A = chainPoints[0], B = chainPoints[chainPoints.length-1];
  const edgeA = findEdgeForPoint(polyPoints, A, epsilon);
  if(!edgeA) return {error:'Un extremo de los muros no está sobre el borde de la habitación.'};
  const poly1 = insertPointOnEdge(polyPoints, edgeA.edgeIndex, edgeA.point);
  const idxA = edgeA.edgeIndex+1;
  const edgeB = findEdgeForPoint(poly1, B, epsilon);
  if(!edgeB) return {error:'El otro extremo de los muros no está sobre el borde de la habitación.'};
  const poly2 = insertPointOnEdge(poly1, edgeB.edgeIndex, edgeB.point);
  const idxB = edgeB.edgeIndex+1;
  const n = poly2.length;
  function arc(from,to){ const res=[]; let i=from; while(true){ res.push(poly2[i]); if(i===to) break; i=(i+1)%n; } return res; }
  const arc1 = arc(idxA,idxB), arc2 = arc(idxB,idxA);
  const chainFwdInterior = chainPoints.slice(1,-1);
  const chainBackInterior = chainFwdInterior.slice().reverse();
  return { poly_1: arc1.concat(chainBackInterior), poly_2: arc2.concat(chainFwdInterior) };
}
/* Ordena un conjunto de muros seleccionados (sin importar el orden) en una cadena de puntos A→...→B */
function buildChainFromWalls(walls){
  const nodePoint = new Map(), adj = new Map();
  walls.forEach((w,idx)=>{
    const ka=keyOfPt(w.a), kb=keyOfPt(w.b);
    nodePoint.set(ka, w.a); nodePoint.set(kb, w.b);
    if(!adj.has(ka)) adj.set(ka, []);
    if(!adj.has(kb)) adj.set(kb, []);
    adj.get(ka).push({to:kb}); adj.get(kb).push({to:ka});
  });
  const startKey = keyOfPt(walls[0].a);
  const seen = new Set([startKey]); const stack=[startKey];
  while(stack.length){ const cur=stack.pop(); for(const e of adj.get(cur)||[]) if(!seen.has(e.to)){ seen.add(e.to); stack.push(e.to); } }
  if(seen.size !== nodePoint.size) return {error:'Los muros seleccionados no forman una única cadena conectada.'};
  const endpoints=[];
  for(const [k,list] of adj.entries()){
    if(list.length===1) endpoints.push(k);
    else if(list.length!==2) return {error:'Los muros seleccionados se ramifican; selecciona solo una cadena simple entre dos puntos.'};
  }
  if(endpoints.length!==2) return {error:'La cadena de muros debe tener exactamente dos extremos libres.'};
  const chain=[endpoints[0]]; let prev=null, cur=endpoints[0];
  while(cur!==endpoints[1]){
    const opts = adj.get(cur).filter(e=>e.to!==prev);
    if(!opts.length) return {error:'No se pudo recorrer la cadena de muros.'};
    prev=cur; cur=opts[0].to; chain.push(cur);
  }
  return {points: chain.map(k=>nodePoint.get(k))};
}
function toggleSplitWall(pid, wallId){
  if(planState.splitWalls.has(wallId)) planState.splitWalls.delete(wallId);
  else planState.splitWalls.add(wallId);

function doSplitRoom(pid){
  const p = getProject(pid);
  const wallIds = Array.from(planState.splitWalls);
  if(wallIds.length<1){ alert('Selecciona primero uno o varios muros que atraviesen la habitación de lado a lado.'); return; }
  const walls = wallIds.map(id=>wallsOnFloor(p).find(w=>w.id===id)).filter(Boolean);
  const chainRes = buildChainFromWalls(walls);
  if(chainRes.error){ alert(chainRes.error); return; }
  const chain = chainRes.points;
  const A = chain[0], B = chain[chain.length-1];
  const rooms = roomsOnFloor(p);
  const parent = rooms.find(r=> findEdgeForPoint(r.points, A, 20) && findEdgeForPoint(r.points, B, 20));
  if(!parent){ alert('Los extremos de los muros deben tocar el borde de una misma habitación para poder dividirla.'); return; }
  const res = splitPolygonByChain(parent.points, chain, 20);
  if(res.error){ alert(res.error); return; }
  planState.pendingSplit = {pid, parentId:parent.id, poly1:res.poly_1, poly2:res.poly_2};
  openModal(`
    <h2>Nombrar los dos espacios</h2>
    <p class="help" style="margin-top:0">El muro seleccionado se conserva como separación entre ambos.</p>
    <div class="field"><label>Nombre del primer espacio</label><input id="split-name-1" value="${escapeHtml(parent.name)} A" placeholder="Ej. Salón"></div>
    <div class="field"><label>Color</label><div>${ROOM_COLORS.map((c,i)=>`<button type="button" class="swatch split-swatch-1" data-c="${c}" style="background:${c};border:2px solid ${c===parent.color?'var(--ink)':'transparent'}" onclick="pickSplitColor(1,this,'${c}')"></button>`).join(' ')}</div><input type="hidden" id="split-color-1" value="${parent.color}"></div>
    <div class="field"><label>Nombre del segundo espacio</label><input id="split-name-2" value="${escapeHtml(parent.name)} B" placeholder="Ej. Cocina"></div>
    <div class="field"><label>Color</label><div>${ROOM_COLORS.map((c,i)=>`<button type="button" class="swatch split-swatch-2" data-c="${c}" style="background:${c};border:2px solid ${i===1?'var(--ink)':'transparent'}" onclick="pickSplitColor(2,this,'${c}')"></button>`).join(' ')}</div><input type="hidden" id="split-color-2" value="${ROOM_COLORS[1]}"></div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="confirmSplitRoom()">Dividir habitación</button></div>
  `, ()=>document.getElementById('split-name-1').focus());
}
function pickSplitColor(n, btn, c){
  document.getElementById('split-color-'+n).value = c;
  document.querySelectorAll('.split-swatch-'+n).forEach(b=>b.style.border='2px solid transparent');
  btn.style.border = '2px solid var(--ink)';

function confirmSplitRoom(){
  const {pid, parentId, poly1, poly2} = planState.pendingSplit;
  const p = getProject(pid);
  const parentIdx = p.rooms.findIndex(r=>r.id===parentId);
  const parent = p.rooms[parentIdx];
  const name1 = (document.getElementById('split-name-1').value||'Espacio A').trim();
  const name2 = (document.getElementById('split-name-2').value||'Espacio B').trim();

/* Geometría de un hueco (puerta/ventana) dentro de un muro: puntos del hueco y vectores del muro */
function openingGeometry(w, o){
  const dx=w.b.x-w.a.x, dy=w.b.y-w.a.y; const len=Math.hypot(dx,dy)||1;
  const ux=dx/len, uy=dy/len, nx=-uy, ny=ux;
  const widthPx = o.width*planState.scale;
  const centerT = o.t*len;
  const t0 = Math.max(0, centerT-widthPx/2), t1 = Math.min(len, centerT+widthPx/2);
  const p0 = {x:w.a.x+ux*t0, y:w.a.y+uy*t0}, p1 = {x:w.a.x+ux*t1, y:w.a.y+uy*t1};
  return {ux,uy,nx,ny,len,widthPx,t0,t1,p0,p1};
}
/* Dibuja las puertas/ventanas de un muro: abre un hueco y añade el símbolo correspondiente */
function drawWallOpenings(ctx, w, bgColor){
  if(!w.openings || !w.openings.length) return;
  const wt = WALL_TYPES[w.type];
  const thickness = (w.thickness||wt.thickness)*planState.scale;
  const h = thickness/2+1;
  w.openings.forEach(o=>{
    const sel = planState.selectedOpening && planState.selectedOpening.wallId===w.id && planState.selectedOpening.id===o.id;
    const {nx,ny,p0,p1,widthPx} = openingGeometry(w,o);
    const gapLen = Math.hypot(p1.x-p0.x, p1.y-p0.y) || 1;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(p0.x+nx*h, p0.y+ny*h); ctx.lineTo(p1.x+nx*h, p1.y+ny*h);
    ctx.lineTo(p1.x-nx*h, p1.y-ny*h); ctx.lineTo(p0.x-nx*h, p0.y-ny*h);
    ctx.closePath(); ctx.fillStyle = bgColor; ctx.fill();
    ctx.strokeStyle= sel ? '#1463D6' : '#4A5A5D'; ctx.lineWidth=sel?2:1.2;
    [p0,p1].forEach(pt=>{ ctx.beginPath(); ctx.moveTo(pt.x+nx*h,pt.y+ny*h); ctx.lineTo(pt.x-nx*h,pt.y-ny*h); ctx.stroke(); });
    if(o.type==='ventana'){
      ctx.strokeStyle = sel ? '#1463D6' : '#0AA9C4'; ctx.lineWidth=1.4;
      [-0.4,0.4].forEach(f=>{
        const off = h*f;
        ctx.beginPath(); ctx.moveTo(p0.x+nx*off, p0.y+ny*off); ctx.lineTo(p1.x+nx*off, p1.y+ny*off); ctx.stroke();
      });
    } else {
      const hinge = p0;
      const leafEndX = hinge.x + nx*gapLen, leafEndY = hinge.y + ny*gapLen;
      const dx2=p1.x-p0.x, dy2=p1.y-p0.y; const uxx=dx2/gapLen, uyy=dy2/gapLen;
      const angleN = Math.atan2(ny,nx), angleU = Math.atan2(uyy,uxx);
      ctx.strokeStyle = sel ? '#1463D6' : '#5A6B6E'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(hinge.x,hinge.y); ctx.lineTo(leafEndX,leafEndY); ctx.stroke();
      ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.arc(hinge.x,hinge.y,gapLen,angleN,angleU,true); ctx.stroke();
      ctx.setLineDash([]);
    }
    if(sel){
      ctx.font='600 9.5px IBM Plex Mono'; ctx.fillStyle='#1463D6';
      const midx=(p0.x+p1.x)/2, midy=(p0.y+p1.y)/2;
      ctx.fillText(Math.round(o.width*100)+' cm', midx-14, midy - h - 6);
      // manejador de redimensionado en el extremo p1
      ctx.fillStyle='#fff'; ctx.strokeStyle='#1463D6'; ctx.lineWidth=1.5;
      ctx.fillRect(p1.x-5,p1.y-5,10,10); ctx.strokeRect(p1.x-5,p1.y-5,10,10);
    }
    ctx.restore();
  });
}

function zoomPlan(dir){

function zoomPlanReset(){
  const p = currentProjectFromHash();
  const canvas = document.getElementById('planCanvas');
  const pts = [];
  if(p){
    roomsOnFloor(p).forEach(r=>pts.push(...r.points));
    wallsOnFloor(p).forEach(w=>pts.push(w.a,w.b));
    columnsOnFloor(p).forEach(c=>pts.push({x:c.x,y:c.y},{x:c.x+c.w,y:c.y+c.h}));
  }
  if(!pts.length || !canvas){ planState.zoom = 1; }
  else{
    const minX=Math.min(...pts.map(pt=>pt.x)), maxX=Math.max(...pts.map(pt=>pt.x));
    const minY=Math.min(...pts.map(pt=>pt.y)), maxY=Math.max(...pts.map(pt=>pt.y));
    const w = Math.max(50,maxX-minX)+90, h = Math.max(50,maxY-minY)+90;
    const holder = canvas.parentElement;
    const z = Math.min(holder.clientWidth/w, holder.clientHeight/h);
    planState.zoom = Math.max(0.3, Math.min(2, Math.round(z*100)/100));
  }
  if(canvas && canvas._redraw) canvas._redraw();
  const z2=document.querySelector('.plan-toolbar .mono'); if(z2) z2.textContent = Math.round(planState.zoom*100)+'%';
}

function moveRoomLayer(pid, rid, dir){

    </select>
    <div id="furnItemsList"></div>
    <p class="help" style="margin:8px 0 4px">O define una medida personalizada:</p>
    <div style="display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap">
      <input id="cf-name" placeholder="Nombre" style="flex:1;min-width:70px">
      <input id="cf-w" type="number" placeholder="Ancho cm" style="width:72px">
      <input id="cf-h" type="number" placeholder="Fondo cm" style="width:72px">
      <button class="btn sm" style="width:100%" onclick="addCustomFurniture('${p.id}')">${ICONS.plus} Añadir a medida</button>
    </div>
    <h3 style="font-size:14px">En esta habitación</h3>
    <p class="help" style="margin-top:0">Toca un mueble en el plano y arrastra su esquina para redimensionarlo, o ajusta cm aquí.</p>
    <div>${(room.furniture||[]).map(f=>`
      <div class="furn-item" style="${planState.selectedFurn===f.id?'border-color:var(--blue)':''}" onclick="planState.selectedRoom='${room.id}';planState.selectedFurn='${f.id}';refreshTab(getProject('${p.id}'))">
        <span>${escapeHtml(f.label)}</span>
        <span style="display:flex;gap:4px;align-items:center;flex-wrap:wrap">
          <input type="number" title="Ancho (cm)" value="${Math.round(f.w/planState.scale*100)}" style="width:52px" onclick="event.stopPropagation()" onchange="event.stopPropagation();updateFurnSize('${p.id}','${room.id}','${f.id}','w',this.value)">
          <span style="font-size:11px;color:var(--ink-soft)">×</span>
          <input type="number" title="Fondo (cm)" value="${Math.round(f.h/planState.scale*100)}" style="width:52px" onclick="event.stopPropagation()" onchange="event.stopPropagation();updateFurnSize('${p.id}','${room.id}','${f.id}','h',this.value)">
          <input type="number" title="Precio" value="${f.price||0}" style="width:62px" onclick="event.stopPropagation()" onchange="event.stopPropagation();updateFurnPrice('${p.id}','${room.id}','${f.id}',this.value)">
          <button class="icon-btn" title="Girar 90°" onclick="event.stopPropagation();rotateFurniture('${p.id}','${room.id}','${f.id}')">⟳</button>
          <button class="icon-btn danger-hover" onclick="event.stopPropagation();removeFurniture('${p.id}','${room.id}','${f.id}')">${ICONS.trash}</button>
        </span>
      </div>`).join('') || '<p style="color:var(--ink-soft);font-size:12.5px">Vacío.</p>'}</div>
  `;
}
function addCustomFurniture(pid){
  const p = getProject(pid);
  const room = p.rooms.find(r=>r.id===planState.selectedRoom);
  if(!room) return;
  const name = (document.getElementById('cf-name').value||'').trim() || 'Mueble a medida';
  const wCm = Number(document.getElementById('cf-w').value)||60;
  const hCm = Number(document.getElementById('cf-h').value)||60;
  const bx = Math.min(...room.points.map(pt=>pt.x)), by = Math.min(...room.points.map(pt=>pt.y));
  const item = {id:uid(), label:name, x:bx+16, y:by+16, w:Math.max(5,wCm/100*planState.scale), h:Math.max(5,hCm/100*planState.scale), price:0, custom:true};
  room.furniture.push(item);
  planState.selectedFurn = item.id;
  touchProject(p); refreshTab(p);
}
function updateFurnSize(pid, rid, fid, dim, valCm){
  const p = getProject(pid); const room = p.rooms.find(r=>r.id===rid);
  const f = room.furniture.find(f=>f.id===fid);
  const px = Math.max(5, (Number(valCm)||1)/100*planState.scale);
  if(dim==='w') f.w = px; else f.h = px;
  touchProject(p); refreshTab(p);
}
function renderFurnItems(){
  const catSel = document.getElementById('furn-cat');
  if(!catSel) return;
  const cat = FURN_CATALOG.find(c=>c.cat===catSel.value);
  document.getElementById('furnItemsList').innerHTML = cat.items.map(it=>
    `<button class="btn sm" style="margin:0 6px 6px 0" onclick="addFurniture('${it}')">${ICONS.plus}${it}</button>`
  ).join('');
}
function currentProjectFromHash(){ return getProject(location.hash.split('/')[2]); }

function addRoom(pid){
  const p = getProject(pid);
  const floorId = currentFloorId(p);
  const n = roomsOnFloor(p).length+1;
  const scale = planState.scale;
  const w = 4*scale, h = 3*scale;
  const x = 20+(n%5)*15, y = 20+(n%5)*15;
  const room = {id:uid(), name:'Habitación '+n, height:2.5, color:ROOM_COLORS[n%ROOM_COLORS.length], notes:'', floor:floorId,
    points:[{x,y},{x:x+w,y},{x:x+w,y:y+h},{x,y:y+h}], furniture:[]};
  p.rooms.push(room); planState.selectedRoom = room.id; touchProject(p); refreshTab(p);
}
function removeRoom(pid, rid){
  if(!confirm('¿Eliminar esta habitación y todo su mobiliario? No se puede deshacer.')) return;
  const p = getProject(pid); p.rooms = p.rooms.filter(r=>r.id!==rid);
  if(planState.selectedRoom===rid) planState.selectedRoom=null;
  touchProject(p); refreshTab(p);
}
function selectRoom(pid, rid){
  planState.selectedRoom = rid; planState.selectedFurn=null; planState.selectedWall=null; planState.selectedColumn=null; planState.selectedOpening=null; planState.drawMode=false; planState.drawPoints=[];
  refreshTab(getProject(pid));
}
function updateRoom(pid, rid, field, value){
  const p = getProject(pid); const r = p.rooms.find(r=>r.id===rid);
  r[field] = (field==='height') ? Number(value) : value;
  touchProject(p); refreshTab(p);
}
function addRoomVertex(pid, rid){
  const p = getProject(pid); const r = p.rooms.find(r=>r.id===rid);
  let maxLen=-1, idx=0;
  for(let i=0;i<r.points.length;i++){
    const a=r.points[i], b=r.points[(i+1)%r.points.length];
    const len = Math.hypot(b.x-a.x,b.y-a.y);
    if(len>maxLen){ maxLen=len; idx=i; }
  }
  const a=r.points[idx], b=r.points[(idx+1)%r.points.length];
  r.points.splice(idx+1,0,{x:(a.x+b.x)/2,y:(a.y+b.y)/2});
  touchProject(p); refreshTab(p);
}
function removeRoomVertex(pid, rid){
  const p = getProject(pid); const r = p.rooms.find(r=>r.id===rid);
  if(r.points.length<=3) return;
  r.points.pop();
  touchProject(p); refreshTab(p);
}
function startFreeDraw(pid){
  planState.drawMode = true; planState.drawPoints = []; planState.selectedRoom = null;
  refreshTab(getProject(pid));
}
function undoDrawPoint(){
  planState.drawPoints.pop(); refreshTab(currentProjectFromHash());
}
function cancelFreeDraw(pid){
  planState.drawMode = false; planState.drawPoints = [];
  refreshTab(getProject(pid));
}
function finishFreeDrawUI(pid){
  if(planState.drawPoints.length<3) return;
  openModal(`
    <h2>Nombrar espacio</h2>
    <div class="field"><label>Nombre</label><input id="fd-name" placeholder="Ej. Cocina, Salón, Habitación 1..."></div>
    <div class="field"><label>Color</label>
      <div>${ROOM_COLORS.map((c,i)=>`<button type="button" class="swatch fd-swatch" data-c="${c}" style="background:${c};border:2px solid ${i===0?'var(--ink)':'transparent'}" onclick="pickFdColor(this,'${c}')"></button>`).join(' ')}</div>
      <input type="hidden" id="fd-color" value="${ROOM_COLORS[0]}">
    </div>
    <div class="modal-actions"><button class="btn ghost" onclick="cancelFreeDrawFromModal('${pid}')">Cancelar</button><button class="btn primary" onclick="saveFreeDraw('${pid}')">Crear espacio</button></div>
  `, ()=>document.getElementById('fd-name').focus());
}
function pickFdColor(btn, c){
  document.getElementById('fd-color').value = c;
  document.querySelectorAll('.fd-swatch').forEach(b=>b.style.border='2px solid transparent');
  btn.style.border = '2px solid var(--ink)';
}
function cancelFreeDrawFromModal(pid){ closeModal(); cancelFreeDraw(pid); }
function saveFreeDraw(pid){
  const name = document.getElementById('fd-name').value.trim() || 'Espacio';
  const color = document.getElementById('fd-color').value;
  const p = getProject(pid);
  const room = {id:uid(), name, color, notes:'', height:2.5, floor:currentFloorId(p), points:planState.drawPoints.map(pt=>({...pt})), furniture:[]};
  p.rooms.push(room);
  planState.drawMode = false; planState.drawPoints = []; planState.selectedRoom = room.id;
  touchProject(p); closeModal(); refreshTab(p);
}
function addFurniture(label){
  const p = currentProjectFromHash();
  const room = p.rooms.find(r=>r.id===planState.selectedRoom);
  if(!room) return;
  const meta = FURN_META[label] || {w:0.6,h:0.6};
  const w = meta.w*planState.scale, h = meta.h*planState.scale;
  const bx = Math.min(...room.points.map(pt=>pt.x)), by = Math.min(...room.points.map(pt=>pt.y));
  const item = {id:uid(), label, x: bx+16, y: by+16, w, h, price:0};
  room.furniture.push(item);
  planState.selectedFurn = item.id;
  touchProject(p); refreshTab(p);
}
function rotateFurniture(pid, rid, fid){
  const p = getProject(pid); const room = p.rooms.find(r=>r.id===rid);
  const f = room.furniture.find(f=>f.id===fid);
  const w=f.w, h=f.h; f.w=h; f.h=w;
  touchProject(p); refreshTab(p);
}
function updateFurnPrice(pid, rid, fid, val){
  const p = getProject(pid); const room = p.rooms.find(r=>r.id===rid);
  const f = room.furniture.find(f=>f.id===fid); f.price = Number(val)||0;
  touchProject(p); refreshTab(p);
}
function removeFurniture(pid, rid, fid){
  const p = getProject(pid); const room = p.rooms.find(r=>r.id===rid);
  room.furniture = room.furniture.filter(f=>f.id!==fid);
  touchProject(p); refreshTab(p);
}

function initPlanCanvas(p){
  const canvas = document.getElementById('planCanvas');
  if(!canvas) return;
  const holder = canvas.parentElement;
  const ctx = canvas.getContext('2d');
  function resize(){
    const dpr = devicePixelRatio;
    canvas.width = Math.max(1,holder.clientWidth) * dpr;
    canvas.height = Math.max(1,holder.clientHeight) * dpr;
    canvas.style.width = holder.clientWidth+'px';
    canvas.style.height = holder.clientHeight+'px';
    draw();
  }
  function draw(){
    const dpr = devicePixelRatio;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,canvas.width/dpr, canvas.height/dpr);
    ctx.setTransform(dpr*planState.zoom,0,0,dpr*planState.zoom,0,0);
    // Cuadrícula de referencia cada 0,5 m, muy sutil, para dar sensación de escala real
    const gridStep = planState.scale*0.5;
    if(gridStep > 5){
      const gw = holder.clientWidth/planState.zoom, gh = holder.clientHeight/planState.zoom;
      ctx.strokeStyle = 'rgba(30,42,46,.06)'; ctx.lineWidth = 1;
      for(let gx=0; gx<gw; gx+=gridStep){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,gh); ctx.stroke(); }
      for(let gy=0; gy<gh; gy+=gridStep){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(gw,gy); ctx.stroke(); }
    }
    const floorRooms = roomsOnFloor(p);
    // Pasada 1: rellenos, contornos y acotaciones de todas las habitaciones (para que ninguna tape la etiqueta de otra)
    floorRooms.forEach(r=>{
      const pts = r.points;
      ctx.beginPath();
      pts.forEach((pt,i)=> i===0 ? ctx.moveTo(pt.x,pt.y) : ctx.lineTo(pt.x,pt.y));
      ctx.closePath();
      ctx.fillStyle = r.color; ctx.fill();
      ctx.strokeStyle = r.id===planState.selectedRoom ? '#1463D6' : 'rgba(30,42,46,.25)';
      ctx.lineWidth = r.id===planState.selectedRoom ? 2.5 : 1.5;
      ctx.stroke();
      pts.forEach((pt,i)=>{ const nxt=pts[(i+1)%pts.length]; drawLenLabel(ctx, pt, nxt, fmtLenPx(distPx(pt,nxt)), 'rgba(30,42,46,.55)'); });
      if(r.id===planState.selectedRoom){
        pts.forEach(pt=>{
          ctx.fillStyle = '#fff'; ctx.strokeStyle = '#1463D6'; ctx.lineWidth = 1.5;
          ctx.fillRect(pt.x-5, pt.y-5, 10, 10); ctx.strokeRect(pt.x-5, pt.y-5, 10, 10);
        });
      }
    });
    // Pasada 2: nombre, m² y mobiliario de cada habitación, siempre por encima de todos los rellenos
    floorRooms.forEach(r=>{
      const pts = r.points;
      const bx = Math.min(...pts.map(pt=>pt.x)), by = Math.min(...pts.map(pt=>pt.y));
      ctx.fillStyle = '#1E2A2E';
      ctx.font = '600 12px IBM Plex Sans';
      ctx.fillText(r.name, bx+6, by+16);
      ctx.font = '11px IBM Plex Mono';
      ctx.fillStyle = 'rgba(30,42,46,.6)';
      ctx.fillText(fmtM2(roomAreaM2(r)), bx+6, by+30);
      (r.furniture||[]).forEach(f=>{
        drawFurnitureSymbol(ctx, f);
        ctx.fillStyle = '#1E2A2E';
        ctx.font = '9.5px IBM Plex Sans';
        ctx.fillText(f.label, f.x+2, f.y+f.h+11);
        if(f.id===planState.selectedFurn){
          ctx.fillStyle='#fff'; ctx.strokeStyle='#1463D6'; ctx.lineWidth=1.5;
          ctx.fillRect(f.x+f.w-5, f.y+f.h-5, 10, 10); ctx.strokeRect(f.x+f.w-5, f.y+f.h-5, 10, 10);
          ctx.font='600 9.5px IBM Plex Mono'; ctx.fillStyle='#1463D6';
          ctx.fillText(Math.round(f.w/planState.scale*100)+'×'+Math.round(f.h/planState.scale*100)+' cm', f.x, Math.max(10,f.y-4));
        }
      });
    });
    const canvasBg = bgColorForCanvas();
    wallsOnFloor(p).forEach(w=>{
      const wt = WALL_TYPES[w.type]; const selected = w.id===planState.selectedWall;
      drawWallShape(ctx, w.a, w.b, (w.thickness||wt.thickness)*planState.scale, selected?'#1463D6':wt.color, wt.fill, false);
      drawWallOpenings(ctx, w, canvasBg);
      drawLenLabel(ctx, w.a, w.b, fmtLenPx(distPx(w.a,w.b)), selected?'#1463D6':'rgba(30,42,46,.7)');
      if(selected){
        [w.a,w.b].forEach(pt=>{ ctx.fillStyle='#fff'; ctx.strokeStyle='#1463D6'; ctx.lineWidth=1.5; ctx.fillRect(pt.x-5,pt.y-5,10,10); ctx.strokeRect(pt.x-5,pt.y-5,10,10); });
      }
    });
    columnsOnFloor(p).forEach(c=>{
      const selected = c.id===planState.selectedColumn;
      ctx.fillStyle = selected? '#3C4A4D':'#2A2F33'; ctx.fillRect(c.x,c.y,c.w,c.h);
      ctx.strokeStyle = selected? '#1463D6':'#12181A'; ctx.lineWidth=1.5; ctx.strokeRect(c.x,c.y,c.w,c.h);
      ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(c.x+c.w,c.y+c.h); ctx.moveTo(c.x+c.w,c.y); ctx.lineTo(c.x,c.y+c.h); ctx.stroke();
      if(selected){
        ctx.font='600 9px IBM Plex Mono'; ctx.fillStyle='#1463D6';
        ctx.fillText(Math.round(c.w/planState.scale*100)+'×'+Math.round(c.h/planState.scale*100)+' cm', c.x, Math.max(10,c.y-4));
        ctx.fillStyle='#fff'; ctx.strokeStyle='#1463D6';
        ctx.fillRect(c.x+c.w-5,c.y+c.h-5,10,10); ctx.strokeRect(c.x+c.w-5,c.y+c.h-5,10,10);
      }
    });
    if(planState.drawMode && planState.drawPoints.length){
      const dp = planState.drawPoints;
      ctx.beginPath();
      dp.forEach((pt,i)=> i===0 ? ctx.moveTo(pt.x,pt.y) : ctx.lineTo(pt.x,pt.y));
      ctx.strokeStyle = '#E43A1E'; ctx.lineWidth = 2; ctx.setLineDash([5,4]); ctx.stroke(); ctx.setLineDash([]);
      for(let i=1;i<dp.length;i++) drawLenLabel(ctx, dp[i-1], dp[i], fmtLenPx(distPx(dp[i-1],dp[i])), '#E43A1E');
      dp.forEach((pt,i)=>{
        ctx.beginPath(); ctx.arc(pt.x,pt.y,5,0,Math.PI*2);
        ctx.fillStyle = i===0 ? '#E43A1E' : '#fff'; ctx.fill();
        ctx.strokeStyle = '#E43A1E'; ctx.lineWidth = 1.5; ctx.stroke();
      });
    }
    if(planState.drawMode && planState.drawPoints.length && planState.mousePos){
      const last = planState.drawPoints[planState.drawPoints.length-1];
      ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(planState.mousePos.x,planState.mousePos.y);
      ctx.strokeStyle='rgba(181,80,46,.6)'; ctx.lineWidth=1.5; ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
      drawLenLabel(ctx, last, planState.mousePos, fmtLenPx(distPx(last,planState.mousePos)), '#E43A1E');
    }
    if(planState.wallMode && planState.wallStart && planState.mousePos){
      const wt = WALL_TYPES[planState.wallType];
      drawWallShape(ctx, planState.wallStart, planState.mousePos, wt.thickness*planState.scale, wt.color, wt.fill, true);
      drawLenLabel(ctx, planState.wallStart, planState.mousePos, fmtLenPx(distPx(planState.wallStart,planState.mousePos)), wt.color);
      ctx.beginPath(); ctx.arc(planState.wallStart.x,planState.wallStart.y,4,0,Math.PI*2); ctx.fillStyle=wt.color; ctx.fill();
    }
    // Overlay fijo (no afectado por el zoom): barra de escala y flecha de norte
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const barY = holder.clientHeight - 18, barX = 14;
    const meterPx = planState.scale*planState.zoom;
    ctx.strokeStyle = '#1E2A2E'; ctx.fillStyle = '#1E2A2E'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(barX,barY); ctx.lineTo(barX+meterPx,barY); ctx.stroke();
    [barX, barX+meterPx].forEach(x=>{ ctx.beginPath(); ctx.moveTo(x,barY-4); ctx.lineTo(x,barY+4); ctx.stroke(); });
    ctx.font = '600 10px IBM Plex Mono';
    ctx.fillText('1 m', barX+meterPx/2-9, barY-7);
    const nx2 = holder.clientWidth - 26, ny2 = 26;
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(nx2,ny2+12); ctx.lineTo(nx2,ny2-12); ctx.lineTo(nx2-5,ny2-3); ctx.moveTo(nx2,ny2-12); ctx.lineTo(nx2+5,ny2-3); ctx.stroke();
    ctx.font = '700 11px IBM Plex Sans'; ctx.fillText('N', nx2-3, ny2-16);
  }
  canvas._redraw = draw;
  function vertexHitTest(pos){
    if(!planState.selectedRoom) return null;
    const room = p.rooms.find(r=>r.id===planState.selectedRoom);
    if(!room) return null;
    for(let i=0;i<room.points.length;i++){
      const pt = room.points[i];
      if(distPx(pos,pt) < 10) return {room, index:i};
    }
    return null;
  }
  function hitTest(mx,my){
    const pos = {x:mx,y:my};
    const cols = columnsOnFloor(p), walls = wallsOnFloor(p), rooms = roomsOnFloor(p);
    for(let i=cols.length-1; i>=0; i--){
      const c = cols[i];
      if(mx>=c.x&&mx<=c.x+c.w&&my>=c.y&&my<=c.y+c.h) return {type:'column', item:c};
    }
    for(let i=walls.length-1; i>=0; i--){
      const w = walls[i];
      for(let j=(w.openings||[]).length-1; j>=0; j--){
        const o = w.openings[j];
        const {p0,p1} = openingGeometry(w,o);
        if(pointToSegDistPx(pos,p0,p1) < 9) return {type:'opening', wall:w, item:o};
      }
    }
    for(let i=walls.length-1; i>=0; i--){
      const w = walls[i];
      const halfT = Math.max(5, (w.thickness||WALL_TYPES[w.type].thickness)*planState.scale/2);
      if(pointToSegDistPx(pos,w.a,w.b) < halfT+4) return {type:'wall', item:w};
    }
    for(let ri=rooms.length-1; ri>=0; ri--){
      const r = rooms[ri];
      for(let fi=(r.furniture||[]).length-1; fi>=0; fi--){
        const f = r.furniture[fi];
        if(mx>=f.x&&mx<=f.x+f.w&&my>=f.y&&my<=f.y+f.h) return {type:'furn', room:r, item:f};
      }
    }
    for(let ri=rooms.length-1; ri>=0; ri--){
      const r = rooms[ri];
      if(pointInPolygon(pos, r.points)) return {type:'room', room:r};
    }
    return null;
  }
  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return {x: (t.clientX-rect.left)/planState.zoom, y: (t.clientY-rect.top)/planState.zoom};
  }
  canvas.onpointerdown = (e)=>{
    const pos = getPos(e);
    planState.mousePos = pos;
    if(planState.drawMode){
      if(planState.drawPoints.length>=3){
        const first = planState.drawPoints[0];
        if(distPx(pos,first) < 14){ finishFreeDrawUI(p.id); return; }
      }
      const origin = planState.drawPoints.length ? planState.drawPoints[planState.drawPoints.length-1] : null;
      const snapped = origin ? smartSnap(pos, p, null, origin) : pos;
      planState.drawPoints.push({x:snapped.x,y:snapped.y});
      draw();
      return;
    }
    if(planState.wallMode){
      if(!planState.wallStart){
        planState.wallStart = snapPoint(pos, p, null);
        draw();
        return;
      }
      const snapped = smartSnap(pos, p, null, planState.wallStart);
      if(distPx(planState.wallStart, snapped) > 4){
        const wt = WALL_TYPES[planState.wallType];
        p.walls.push({id:uid(), type:planState.wallType, thickness:wt.thickness, floor:currentFloorId(p), a:{...planState.wallStart}, b:{...snapped}, openings:[]});
        touchProject(p);
      }
      planState.wallStart = snapped;
      const sp=document.getElementById('structPanel'); if(sp) sp.innerHTML = renderStructPanel(p);
      draw();
      return;
    }
    if(planState.columnMode){
      const wCol = 0.3*planState.scale, hCol = 0.3*planState.scale;
      const item = {id:uid(), x:pos.x-wCol/2, y:pos.y-hCol/2, w:wCol, h:hCol, floor:currentFloorId(p)};
      p.columns.push(item);
      planState.selectedColumn = item.id;
      touchProject(p);
      const sp=document.getElementById('structPanel'); if(sp) sp.innerHTML = renderStructPanel(p);
      draw();
      return;
    }
    if(planState.selectedFurn){
      const room = p.rooms.find(r=>(r.furniture||[]).some(f=>f.id===planState.selectedFurn));
      const f = room && room.furniture.find(f=>f.id===planState.selectedFurn);
      if(f && distPx(pos,{x:f.x+f.w,y:f.y+f.h}) < 10){
        planState.drag = {type:'resize-furn', obj:f};
        canvas.setPointerCapture(e.pointerId); draw(); return;
      }
    }
    if(planState.selectedColumn){
      const col = (p.columns||[]).find(c=>c.id===planState.selectedColumn);
      if(col && distPx(pos,{x:col.x+col.w,y:col.y+col.h}) < 10){
        planState.drag = {type:'resize-col', obj:col};
        canvas.setPointerCapture(e.pointerId); draw(); return;
      }
    }
    if(planState.selectedOpening){
      const ow = (p.walls||[]).find(w=>w.id===planState.selectedOpening.wallId);
      const oo = ow && (ow.openings||[]).find(o=>o.id===planState.selectedOpening.id);
      if(ow && oo){
        const {p1} = openingGeometry(ow,oo);
        if(distPx(pos,p1) < 10){
          planState.drag = {type:'resize-opening', wall:ow, opening:oo};
          canvas.setPointerCapture(e.pointerId); draw(); return;
        }
      }
    }
    const vh = vertexHitTest(pos);
    if(vh){
      planState.drag = {type:'vertex', room:vh.room, index:vh.index};
      canvas.setPointerCapture(e.pointerId); draw(); return;
    }
    if(planState.selectedWall){
      const w = (p.walls||[]).find(w=>w.id===planState.selectedWall);
      if(w){
        if(distPx(pos,w.a)<10){ planState.drag={type:'wall-end', wall:w, end:'a'}; canvas.setPointerCapture(e.pointerId); draw(); return; }
        if(distPx(pos,w.b)<10){ planState.drag={type:'wall-end', wall:w, end:'b'}; canvas.setPointerCapture(e.pointerId); draw(); return; }
      }
    }
    const hit = hitTest(pos.x,pos.y);
    if(hit){
      if(hit.type==='room'){ planState.selectedRoom = hit.room.id; planState.selectedFurn=null; planState.selectedWall=null; planState.selectedColumn=null; planState.selectedOpening=null;
        planState.drag = {type:'room', room:hit.room, startPos:pos, startPoints:hit.room.points.map(pt=>({...pt}))}; }
      else if(hit.type==='furn'){ planState.selectedRoom = hit.room.id; planState.selectedFurn = hit.item.id; planState.selectedWall=null; planState.selectedColumn=null; planState.selectedOpening=null;
        planState.drag = {type:'furn', obj:hit.item, ox:pos.x-hit.item.x, oy:pos.y-hit.item.y}; }
      else if(hit.type==='wall'){ planState.selectedWall = hit.item.id; planState.selectedFurn=null; planState.selectedColumn=null; planState.selectedRoom=null; planState.selectedOpening=null;
        planState.drag = {type:'wall-move', wall:hit.item, startPos:pos, startA:{...hit.item.a}, startB:{...hit.item.b}}; }
      else if(hit.type==='opening'){ planState.selectedWall = hit.wall.id; planState.selectedOpening = {wallId:hit.wall.id, id:hit.item.id}; planState.selectedFurn=null; planState.selectedColumn=null; planState.selectedRoom=null;
        const {len} = openingGeometry(hit.wall, hit.item);
        planState.drag = {type:'opening-move', wall:hit.wall, opening:hit.item, len}; }
      else if(hit.type==='column'){ planState.selectedColumn = hit.item.id; planState.selectedFurn=null; planState.selectedWall=null; planState.selectedRoom=null; planState.selectedOpening=null;
        planState.drag = {type:'col-move', obj:hit.item, ox:pos.x-hit.item.x, oy:pos.y-hit.item.y}; }
      canvas.setPointerCapture(e.pointerId);
      document.getElementById('roomList').innerHTML = renderRoomList(p);
      const sp=document.getElementById('structPanel'); if(sp) sp.innerHTML = renderStructPanel(p);
      document.getElementById('furnPanel').innerHTML = renderFurnPanel(p);
    } else { planState.selectedFurn=null; planState.selectedWall=null; planState.selectedColumn=null; planState.selectedOpening=null; }
    draw();
  };
  canvas.onpointermove = (e)=>{
    const pos = getPos(e);
    if(planState.wallMode && planState.wallStart){
      planState.mousePos = smartSnap(pos, p, null, planState.wallStart);
    } else if(planState.drawMode && planState.drawPoints.length){
      planState.mousePos = smartSnap(pos, p, null, planState.drawPoints[planState.drawPoints.length-1]);
    } else {
      planState.mousePos = pos;
    }
    if(planState.drag){
      if(planState.drag.type==='vertex'){
        planState.drag.room.points[planState.drag.index] = {x:Math.max(0,pos.x), y:Math.max(0,pos.y)};
      } else if(planState.drag.type==='room'){
        const dx = pos.x-planState.drag.startPos.x, dy = pos.y-planState.drag.startPos.y;
        planState.drag.room.points = planState.drag.startPoints.map(pt=>({x:pt.x+dx,y:pt.y+dy}));
      } else if(planState.drag.type==='furn'){
        planState.drag.obj.x = Math.max(0, pos.x-planState.drag.ox);
        planState.drag.obj.y = Math.max(0, pos.y-planState.drag.oy);
      } else if(planState.drag.type==='resize-furn'){
        const f = planState.drag.obj;
        f.w = Math.max(8, pos.x-f.x); f.h = Math.max(8, pos.y-f.y);
      } else if(planState.drag.type==='resize-col'){
        const c = planState.drag.obj;
        c.w = Math.max(6, pos.x-c.x); c.h = Math.max(6, pos.y-c.y);
      } else if(planState.drag.type==='col-move'){
        planState.drag.obj.x = pos.x-planState.drag.ox; planState.drag.obj.y = pos.y-planState.drag.oy;
      } else if(planState.drag.type==='wall-end'){
        const otherEnd = planState.drag.end==='a' ? planState.drag.wall.b : planState.drag.wall.a;
        planState.drag.wall[planState.drag.end] = smartSnap(pos, p, planState.drag.wall.id, otherEnd);
      } else if(planState.drag.type==='wall-move'){
        const dx = pos.x-planState.drag.startPos.x, dy = pos.y-planState.drag.startPos.y;
        planState.drag.wall.a = {x:planState.drag.startA.x+dx, y:planState.drag.startA.y+dy};
        planState.drag.wall.b = {x:planState.drag.startB.x+dx, y:planState.drag.startB.y+dy};
      } else if(planState.drag.type==='opening-move'){
        const w = planState.drag.wall, o = planState.drag.opening;
        const dx=w.b.x-w.a.x, dy=w.b.y-w.a.y; const len=Math.hypot(dx,dy)||1;
        const ux=dx/len, uy=dy/len;
        const t = ((pos.x-w.a.x)*ux + (pos.y-w.a.y)*uy)/len;
        const hw = halfWidthFrac(o, w);
        o.t = Math.max(hw, Math.min(1-hw, t));
      } else if(planState.drag.type==='resize-opening'){
        const w = planState.drag.wall, o = planState.drag.opening;
        const dx=w.b.x-w.a.x, dy=w.b.y-w.a.y; const len=Math.hypot(dx,dy)||1;
        const ux=dx/len, uy=dy/len;
        const {t0} = openingGeometry(w,o);
        const t1raw = ((pos.x-w.a.x)*ux + (pos.y-w.a.y)*uy);
        const t1 = Math.max(t0+8, Math.min(len, t1raw));
        const newWidthPx = t1-t0;
        o.width = Math.max(0.3, newWidthPx/planState.scale);
        o.t = Math.min(1, (t0+newWidthPx/2)/len);
      }
      draw();
      return;
    }
    if(planState.drawMode || (planState.wallMode && planState.wallStart)) draw();
  };
  canvas.onpointerup = ()=>{
    if(planState.drag){
      const t = planState.drag.type;
      planState.drag = null; touchProject(p);
      if(t==='furn'||t==='resize-furn'){ const fp=document.getElementById('furnPanel'); if(fp) fp.innerHTML = renderFurnPanel(p); }
      if(t==='wall-end'||t==='wall-move'||t==='col-move'||t==='resize-col'||t==='opening-move'||t==='resize-opening'){ const sp=document.getElementById('structPanel'); if(sp) sp.innerHTML = renderStructPanel(p); }
      draw();
    }
  };
  if(window._planResizeListener) window.removeEventListener('resize', window._planResizeListener);
  window._planResizeListener = resize;
  window.addEventListener('resize', resize);
  if(canvas._ro) canvas._ro.disconnect();
  const ro = new ResizeObserver(()=>resize());
  ro.observe(holder);
  canvas._ro = ro;
  resize();
}

}

function fileToDataUrl(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }

// Sube un archivo al almacén en la nube (Cloudflare R2) en vez de
// meterlo entero como texto en los datos del proyecto — así no hay
// límite práctico de tamaño ni se llena el localStorage del navegador.
async function uploadFile(file){
  const token = getToken();
  const res = await fetch('/api/files', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + token,
      'X-File-Name': encodeURIComponent(file.name),
      'Content-Type': file.type || 'application/octet-stream'
    },
    body: file
  });
  if(!res.ok) throw new Error('No se pudo subir '+file.name);
  return res.json(); // {key, url, name}
}
// Añade el token de sesión como parámetro para poder mostrar la
// imagen/documento en <img>/<a>, que no pueden enviar cabeceras.
function fileUrl(item){
  if(item.url) return item.url + '?t=' + encodeURIComponent(getToken());
  return item.data || ''; // compatibilidad con fotos/documentos antiguos guardados en base64
}
async function deleteRemoteFile(key){
  if(!key) return;
  try{ await apiFetch('/api/files/'+key, {method:'DELETE'}); }catch(e){ console.warn('No se pudo borrar el archivo remoto', e); }
}

async function addPhotos(id, files){
  const p = getProject(id);
  for(const f of files){
    try{
      const {key, url} = await uploadFile(f);
      p.photos.push({id:uid(), name:f.name, key, url});
    }catch(e){ toast('Error subiendo '+f.name); }
  }
  touchProject(p); refreshTab(p);
}
function removePhoto(id, pid){
  const p=getProject(id);
  const ph = p.photos.find(x=>x.id===pid);
  if(ph && ph.key) deleteRemoteFile(ph.key);
  p.photos=p.photos.filter(x=>x.id!==pid); touchProject(p); refreshTab(p);
}
async function addDocs(id, files){
  const p = getProject(id);
  for(const f of files){
    try{
      const {key, url} = await uploadFile(f);
      p.documents.push({id:uid(), name:f.name, key, url});
    }catch(e){ toast('Error subiendo '+f.name); }
  }
  touchProject(p); refreshTab(p);
}
function removeDoc(id, did){
  const p=getProject(id);
  const d = p.documents.find(x=>x.id===did);
  if(d && d.key) deleteRemoteFile(d.key);
  p.documents=p.documents.filter(x=>x.id!==did); touchProject(p); refreshTab(p);
}
function addLink(id){
  const val = document.getElementById('link-input').value.trim(); if(!val) return;
  const p = getProject(id); p.links.push({id:uid(), url:val}); touchProject(p); refreshTab(p);
}
function removeLink(id, lid){ const p=getProject(id); p.links=p.links.filter(x=>x.id!==lid); touchProject(p); refreshTab(p); }

/* ---------- COMPARE ---------- */
let compareSel = [];
function viewCompare(){
  const projects = DB.projects;
  if(compareSel.length===0 && projects.length) compareSel = projects.slice(0, Math.min(2,projects.length)).map(p=>p.id);
  const selected = projects.filter(p=>compareSel.includes(p.id));
  return `
    <div class="pagehead"><div><div class="eyebrow">Análisis</div><h1>Comparar proyectos</h1><p>Selecciona los proyectos que quieres poner en paralelo.</p></div></div>
    ${projects.length===0? `<div class="empty"><h3>No hay proyectos</h3><p>Crea al menos dos proyectos para poder compararlos.</p></div>` : `
    <div class="compare-select">
      ${projects.map(p=>`<button class="compare-chip ${compareSel.includes(p.id)?'on':''}" onclick="toggleCompare('${p.id}')">${escapeHtml(p.name)}</button>`).join('')}
    </div>
    ${selected.length===0? `<p style="color:var(--ink-soft)">Selecciona al menos un proyecto.</p>` : `
    <div class="card" style="overflow-x:auto">
      <table>
        <thead><tr><th>Métrica</th>${selected.map(p=>`<th>${escapeHtml(p.name)}</th>`).join('')}</tr></thead>
        <tbody>
          <tr><td>Estado</td>${selected.map(p=>`<td>${p.status}</td>`).join('')}</tr>
          <tr><td>Precio de compra</td>${selected.map(p=>`<td class="num">${fmtMoney(p.purchasePrice)}</td>`).join('')}</tr>
          <tr><td>Superficie</td>${selected.map(p=>`<td class="num">${fmtM2(totalArea(p))}</td>`).join('')}</tr>
          <tr><td>Habitaciones</td>${selected.map(p=>`<td class="num">${p.rooms.length}</td>`).join('')}</tr>
          <tr><td>Coste reforma</td>${selected.map(p=>`<td class="num">${fmtMoney(p.budget.reforma||0)}</td>`).join('')}</tr>
          <tr><td>Coste mobiliario</td>${selected.map(p=>`<td class="num">${fmtMoney(furnitureTotal(p))}</td>`).join('')}</tr>
          <tr><td style="font-weight:700">Coste total</td>${selected.map(p=>`<td class="num" style="font-weight:700">${fmtMoney(totalCost(p))}</td>`).join('')}</tr>
          <tr><td>Coste por m²</td>${selected.map(p=>`<td class="num">${fmtMoney(costPerM2(p))}</td>`).join('')}</tr>
          <tr><td>Ventajas</td>${selected.map(p=>`<td class="num">${p.prosCons.filter(x=>x.type==='pro').length}</td>`).join('')}</tr>
          <tr><td>Inconvenientes</td>${selected.map(p=>`<td class="num">${p.prosCons.filter(x=>x.type==='con').length}</td>`).join('')}</tr>
          <tr><td style="font-weight:700">Puntuación</td>${selected.map(p=>{const s=projectScore(p); return `<td class="num" style="font-weight:700">${s!==null?s:'—'}</td>`}).join('')}</tr>
        </tbody>
      </table>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Coste total comparado</h3>
      ${selected.map(p=>{
        const max = Math.max(...selected.map(x=>totalCost(x)),1);
        const pct = (totalCost(p)/max)*100;
        return `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>${escapeHtml(p.name)}</span><span class="mono">${fmtMoney(totalCost(p))}</span></div><div class="progress"><div style="width:${pct}%"></div></div></div>`;
      }).join('')}
    </div>
    `}`}
  `;
}
function toggleCompare(id){
  compareSel = compareSel.includes(id) ? compareSel.filter(x=>x!==id) : [...compareSel, id];
  render(['compare']);
}
