function addMaterial(editId){
  const m = editId ? DB.materials.find(x=>x.id===editId) : null;
  openModal(`
    <h2>${m?'Editar material':'Nuevo material'}</h2>
    <div class="grid2">
      <div class="field"><label>Categoría</label>
        <select id="mt-cat">${['Suelo','Pared','Ventana','Puerta','Otro'].map(c=>`<option ${(m?m.category:'')===c?'selected':''}>${c}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Nombre</label><input id="mt-name" value="${m?escapeHtml(m.name):''}" placeholder="Ej. Parquet roble"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Precio</label><input id="mt-price" type="number" value="${m?m.price:0}"></div>
      <div class="field"><label>Unidad</label><select id="mt-unit"><option value="m2" ${(!m||m.unit==='m2')?'selected':''}>€/m²</option><option value="ud" ${(m&&m.unit==='ud')?'selected':''}>€/unidad</option></select></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Proveedor</label><input id="mt-prov" value="${m?escapeHtml(m.provider||''):''}"></div>
      <div class="field"><label>Color</label><input id="mt-color" type="color" value="${m?(m.color||'#DCE8ED'):'#DCE8ED'}"></div>
    </div>
    <div class="field"><label>Enlace</label><input id="mt-link" value="${m?escapeHtml(m.link||''):''}" placeholder="https://..."></div>
    <div class="field"><label>Notas</label><textarea id="mt-notes">${m?escapeHtml(m.notes||''):''}</textarea></div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveMaterial('${editId||''}')">Guardar</button></div>
  `, ()=>document.getElementById('mt-name').focus());
}
function saveMaterial(editId){
  const name = document.getElementById('mt-name').value.trim(); if(!name) return;
  const vals = {category:document.getElementById('mt-cat').value, name,
    price:Number(document.getElementById('mt-price').value)||0, unit:document.getElementById('mt-unit').value,
    provider:document.getElementById('mt-prov').value, color:document.getElementById('mt-color').value,
    link:document.getElementById('mt-link').value, notes:document.getElementById('mt-notes').value};
  if(editId){
    const m = DB.materials.find(x=>x.id===editId); Object.assign(m, vals);
  } else {
    DB.materials.push({id:uid(), ...vals});
  }
  save(); closeModal(); render(['materials']);
}
function removeMaterial(id){ DB.materials = DB.materials.filter(m=>m.id!==id); save(); render(['materials']); }

function viewSettings(){
  return `
    <div class="pagehead"><div><div class="eyebrow">Datos locales</div><h1>Ajustes y copia de seguridad</h1><p>Todos tus datos viven únicamente en este dispositivo.</p></div></div>
    <div class="card">
      <h3 style="margin-top:0">Copia de seguridad</h3>
      <p style="color:var(--ink-soft);font-size:13.5px">Exporta todos tus proyectos y materiales a un archivo. Puedes importarlo en otro dispositivo para tener la misma información.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn primary" onclick="exportBackup()">Exportar copia (.json)</button>
        <label class="btn">Importar copia<input type="file" accept="application/json" style="display:none" onchange="importBackup(this.files[0])"></label>
      </div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Apariencia</h3>
      <div class="rowline"><span>Modo oscuro</span><button class="switch" onclick="toggleTheme()"></button></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0;color:var(--brick)">Zona de riesgo</h3>
      <p style="color:var(--ink-soft);font-size:13.5px">Elimina todos los proyectos y materiales de este dispositivo.</p>
      <button class="btn danger" onclick="wipeAll()">${ICONS.trash} Borrar todos los datos</button>
    </div>
  `;
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'casa-planner-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(url);
  toast('Copia exportada');
}
function importBackup(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const data = JSON.parse(r.result);
      if(!data.projects) throw new Error('formato inválido');
      DB = Object.assign(defaultDB(), data); save(); applyTheme();
      toast('Copia importada correctamente'); route();
    }catch(e){ alert('El archivo no es una copia válida.'); }
  };
  r.readAsText(file);
}
function wipeAll(){
  if(!confirm('Esto eliminará TODOS tus proyectos y materiales de este dispositivo. ¿Continuar?')) return;
  DB = defaultDB(); save(); applyTheme(); location.hash='#/dashboard'; route();
}

/* ---------------- EXPORTAR A PDF ---------------- */
function renderPlanSnapshotDataURL(p, floorId){
  const rooms = floorId ? p.rooms.filter(r=>(r.floor||(p.floors&&p.floors[0].id))===floorId) : p.rooms;
  const walls = floorId ? (p.walls||[]).filter(w=>(w.floor||(p.floors&&p.floors[0].id))===floorId) : (p.walls||[]);
  const columns = floorId ? (p.columns||[]).filter(c=>(c.floor||(p.floors&&p.floors[0].id))===floorId) : (p.columns||[]);
  if(!rooms.length) return null;
  const allPts = rooms.flatMap(r=>r.points)
    .concat(walls.flatMap(w=>[w.a,w.b]))
    .concat(columns.flatMap(c=>[{x:c.x,y:c.y},{x:c.x+c.w,y:c.y+c.h}]));
  const minX = Math.min(...allPts.map(pt=>pt.x)), maxX = Math.max(...allPts.map(pt=>pt.x));
  const minY = Math.min(...allPts.map(pt=>pt.y)), maxY = Math.max(...allPts.map(pt=>pt.y));
  const pad = 30;
  const w = Math.max(200, (maxX-minX)+pad*2), h = Math.max(150, (maxY-minY)+pad*2);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0,0,w,h);
  ctx.save();
  ctx.translate(pad-minX, pad-minY);
  rooms.forEach(r=>{
    const pts = r.points;
    ctx.beginPath();
    pts.forEach((pt,i)=> i===0?ctx.moveTo(pt.x,pt.y):ctx.lineTo(pt.x,pt.y));
    ctx.closePath();
    ctx.fillStyle = r.color; ctx.fill();
    ctx.strokeStyle = 'rgba(30,42,46,.4)'; ctx.lineWidth = 1.5; ctx.stroke();
    pts.forEach((pt,i)=>{ const nxt=pts[(i+1)%pts.length]; drawLenLabel(ctx, pt, nxt, fmtLenPx(distPx(pt,nxt)), 'rgba(30,42,46,.55)'); });
  });
  rooms.forEach(r=>{
    const pts = r.points;
    const bx = Math.min(...pts.map(pt=>pt.x)), by = Math.min(...pts.map(pt=>pt.y));
    ctx.fillStyle = '#1E2A2E'; ctx.font = '600 13px sans-serif';
    ctx.fillText(r.name, bx+6, by+18);
    ctx.font = '11px monospace'; ctx.fillStyle = 'rgba(30,42,46,.6)';
    ctx.fillText(fmtM2(roomAreaM2(r)), bx+6, by+32);
    (r.furniture||[]).forEach(f=>drawFurnitureSymbol(ctx, f));
  });
  walls.forEach(w2=>{
    const wt = WALL_TYPES[w2.type];
    drawWallShape(ctx, w2.a, w2.b, (w2.thickness||wt.thickness)*planState.scale, wt.color, wt.fill, false);
    drawWallOpenings(ctx, w2, '#FFFFFF');
    drawLenLabel(ctx, w2.a, w2.b, fmtLenPx(distPx(w2.a,w2.b)), 'rgba(30,42,46,.7)');
  });
  columns.forEach(c=>{
    ctx.fillStyle='#2A2F33'; ctx.fillRect(c.x,c.y,c.w,c.h);
    ctx.strokeStyle='#12181A'; ctx.lineWidth=1.5; ctx.strokeRect(c.x,c.y,c.w,c.h);
  });
  ctx.restore();
  return canvas.toDataURL('image/png');
}
function exportProjectPDF(id){
  const p = getProject(id);
  if(!p) return;
  const floors = (p.floors&&p.floors.length) ? p.floors : [{id:null,name:'Planta'}];

  const score = projectScore(p);
  const pros = p.prosCons.filter(x=>x.type==='pro');
  const cons = p.prosCons.filter(x=>x.type==='con');
  const html = `
    <div class="pr-header">
      <h1>${escapeHtml(p.name)}</h1>
      <p>${escapeHtml(p.type)} ${p.location?'· '+escapeHtml(p.location):''} · Estado: ${p.status}</p>
    </div>
    <div class="pr-section">
      <h2>Resumen</h2>
      <table class="pr-table">
        <tr><td>Coste total estimado</td><td>${fmtMoney(totalCost(p))}</td></tr>
        <tr><td>Presupuesto máximo</td><td>${fmtMoney(p.maxBudget||0)}</td></tr>
        <tr><td>Superficie total</td><td>${fmtM2(totalArea(p))}</td></tr>
        <tr><td>Coste por m²</td><td>${fmtMoney(costPerM2(p))}</td></tr>
        <tr><td>Puntuación</td><td>${score!==null?score+'/100':'—'}</td></tr>
      </table>
      ${p.description?`<p style="font-size:12.5px;color:#5B6B6E;white-space:pre-wrap;margin-top:8px">${escapeHtml(p.description)}</p>`:''}
    </div>
    ${floorPlans.length?`<div class="pr-section"><h2>Plano</h2>${floorPlans.map(fp=>`<p style="font-weight:600;font-size:13px;margin:10px 0 4px">${escapeHtml(fp.name)}</p><img class="pr-plan-img" src="${fp.img}">`).join('')}</div>`:''}
    <div class="pr-section">
      <h2>Habitaciones</h2>
      <table class="pr-table">
        <thead><tr><th style="text-align:left">Planta</th><th style="text-align:left">Nombre</th><th style="text-align:left">Superficie</th><th style="text-align:left">Altura</th><th style="text-align:left">Mobiliario</th></tr></thead>
        <tbody>${p.rooms.map(r=>{
          const fl = (p.floors||[]).find(f=>f.id===r.floor);
          return `<tr><td>${escapeHtml(fl?fl.name:'—')}</td><td>${escapeHtml(r.name)}</td><td>${fmtM2(roomAreaM2(r))}</td><td>${r.height||2.5} m</td><td>${(r.furniture||[]).map(f=>escapeHtml(f.label)).join(', ')||'—'}</td></tr>`;
        }).join('') || '<tr><td colspan="5">Sin habitaciones.</td></tr>'}</tbody>
      </table>
    </div>
    <div class="pr-section">
      <h2>Presupuesto</h2>
      <table class="pr-table"><tbody>
        <tr><td>Precio vivienda</td><td>${fmtMoney(p.purchasePrice)}</td></tr>
        ${BUDGET_FIELDS.map(([k,label])=>`<tr><td>${label}</td><td>${fmtMoney(p.budget[k]||0)}</td></tr>`).join('')}
        <tr><td>Mobiliario</td><td>${fmtMoney(furnitureTotal(p))}</td></tr>
        <tr style="font-weight:700"><td>Total</td><td>${fmtMoney(totalCost(p))}</td></tr>
      </tbody></table>
    </div>
    <div class="pr-section">
      <h2>Pros y contras</h2>
      <div class="pr-two-col">
        <div><h3>Ventajas</h3><ul>${pros.map(x=>`<li>${escapeHtml(x.text)}</li>`).join('')||'<li>—</li>'}</ul></div>
        <div><h3>Inconvenientes</h3><ul>${cons.map(x=>`<li>${escapeHtml(x.text)}</li>`).join('')||'<li>—</li>'}</ul></div>
      </div>
    </div>
    <div class="pr-section">
      <h2>Tareas</h2>
      <ul>${p.tasks.map(t=>`<li>${t.status==='Hecha'?'✓ ':'☐ '}${escapeHtml(t.text)} ${t.date?'('+t.date+')':''}${t.cost?' · '+fmtMoney(t.cost):''}</li>`).join('')||'<li>—</li>'}</ul>
    </div>
    <div class="pr-section">
      <h2>Cronograma</h2>
      <ul>${p.timeline.map(t=>`<li>${escapeHtml(t.phase)} — ${t.status}${t.start?(' ('+t.start+' → '+(t.end||'?')+')'):''}</li>`).join('')||'<li>—</li>'}</ul>
    </div>
    ${p.photos.length?`<div class="pr-section"><h2>Fotografías</h2><div class="pr-photo-grid">${p.photos.map(ph=>`<img src="${fileUrl(ph)}">`).join('')}</div></div>`:''}
    ${(p.documents.length||p.links.length)?`<div class="pr-section"><h2>Documentos y enlaces</h2><ul>${p.documents.map(d=>`<li>📄 ${escapeHtml(d.name)}</li>`).join('')}${p.links.map(l=>`<li>🔗 ${escapeHtml(l.url)}</li>`).join('')}</ul></div>`:''}
    <div class="pr-footer">Generado con Casa Planner · ${new Date().toLocaleDateString('es-ES')}</div>
  `;
  document.getElementById('print-root').innerHTML = html;
  setTimeout(()=>window.print(), 60);
}
