name = "planner"
compatibility_date = "2026-09-01"
main = "src/worker.js"

# Sirve todo lo que haya en public/ (index.html, etc.) como archivos
# estáticos. Las peticiones a /api/* las intercepta el Worker antes
# de que se sirvan como archivo estático (ver run_worker_first).
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

# --- Espacios KV ---
# PASO IMPORTANTE: sustituye "PON-AQUI-EL-ID..." por el ID real de cada
# namespace, que verás en el panel de Cloudflare al crearlos (Storage &
# Databases -> KV -> abre el namespace -> el ID aparece arriba).
[[kv_namespaces]]
binding = "USERS"
id = "8ffb5bb6860443978285f373b479c65b"

[[kv_namespaces]]
binding = "APPDATA"
id = "b60a70644f5c45cc9f39d6da7ba42a31"

# JWT_SECRET NO va aquí (nunca subas secretos al repositorio).
# Se añade aparte, desde el panel de Cloudflare o con:
#   npx wrangler secret put JWT_SECRET
 [observability] enabled = true Guarda con Commit changes
